const col = h => tavolozza[h] || (tavolozza[h] = new THREE.Color(h));

// ?solo=<parole del nome> tiene solo gli edifici con quel nome: serve per le prove di superficie
const SOLO = chiesto.get('solo');
// il gioco dei gavettoni si accende dalla tessera (costruisci.py --gioco) o con ?gioco nell'indirizzo
const GIOCO = !!S.fumetto && !SOLO && (!!D.gioco || chiesto.has('gioco'));
if (SOLO) {
  const filtro = new RegExp(SOLO, 'i');
  D.edifici = D.edifici.filter(e => filtro.test(e.n || ''));
  D.strade = []; D.piazze = []; D.verde = []; D.alberi = [];
}
// il riquadro di suolo che si disegna: tutta la tessera, oppure il giro degli edifici tenuti
const RIQ = (() => {
  if (!SOLO || !D.edifici.length) return [-LARGO, LARGO, -LARGO, LARGO];
  let e0 = 1e9, e1 = -1e9, n0 = 1e9, n1 = -1e9;
  for (const ed of D.edifici) for (const p of ed.r) {
    e0 = Math.min(e0, p[0]); e1 = Math.max(e1, p[0]); n0 = Math.min(n0, p[1]); n1 = Math.max(n1, p[1]);
  }
  return [e0 - 45, e1 + 45, n0 - 45, n1 + 45];
})();

// --- cartoncino: grana fitta che sparisce da lontano, chiazze larghe, fibre orizzontali (kraft),
// piede dei muri piu scuro e una riga a ogni piano. Sta in poche righe aggiunte al materiale.
const CARTA = { uGrana: { value: S.grana }, uFibra: { value: S.fibra }, uPiede: { value: S.piede }, uPiani: { value: S.piani } };
const CARTA_GLSL = `
uniform float uGrana; uniform float uFibra; uniform float uPiede; uniform float uPiani;
varying vec3 vMondo; varying float vPiede; varying float vMuro;
float caso(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
float rumore(vec3 p) {
  vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(caso(i), caso(i + vec3(1, 0, 0)), f.x), mix(caso(i + vec3(0, 1, 0)), caso(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(caso(i + vec3(0, 0, 1)), caso(i + vec3(1, 0, 1)), f.x), mix(caso(i + vec3(0, 1, 1)), caso(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}`;
const CARTA_CORPO = `
{
  float px = length(fwidth(vMondo));
  float g = (rumore(vMondo * 2.6) - 0.5) * smoothstep(1.6, 0.4, px) + (rumore(vMondo * 0.22 + 7.0) - 0.5) * 0.6;
  vec3 lungo = vec3(dot(vMondo.xz, vec2(0.7, 0.7)) * 0.35, vMondo.y * 5.0, dot(vMondo.xz, vec2(-0.7, 0.7)) * 0.35);
  g += uFibra * (rumore(lungo) - 0.5) * smoothstep(0.8, 0.2, px);
  diffuseColor.rgb *= 1.0 + uGrana * g;
  diffuseColor.rgb *= 1.0 - uPiede * (1.0 - smoothstep(0.0, 7.0, vPiede));
  float d = abs(fract(vPiede / 3.6 + 0.5) - 0.5) * 3.6, w = max(0.1, px * 0.8);
  diffuseColor.rgb *= 1.0 - uPiani * vMuro * (1.0 - smoothstep(w * 0.5, w, d)) * smoothstep(1.7, 0.6, px);
}`;
// --- fumetto: la luce diventa tre toni. In pieno sole la tinta piatta, in penombra un retino di
// puntini che crescono, in ombra la tinta d'ombra piena. I puntini stanno fermi sullo schermo.
const FUMO = { uSole: { value: 1 }, uOmbra: { value: new THREE.Vector3(...(S.ombra || [0.6, 0.6, 0.7])) }, uRetino: { value: 5 } };
const FUMO_CORPO = `
{
  float alb = max(dot(diffuseColor.rgb, vec3(0.3333)), 0.002);
  float t = clamp(dot(reflectedLight.directDiffuse, vec3(0.3333)) / alb / uSole, 0.0, 1.0);
  vec2 q = mat2(0.866, 0.5, -0.5, 0.866) * gl_FragCoord.xy / uRetino;
  float r = length(fract(q) - 0.5);
  float buio = 1.0 - smoothstep(0.10, 0.60, t);
  float raggio = 0.8 * sqrt(buio);
  float punto = (1.0 - smoothstep(raggio - 0.08, raggio + 0.08, r)) * step(0.015, buio);
  outgoingLight = mix(diffuseColor.rgb, diffuseColor.rgb * uOmbra, punto);
  // seconda uscita, per l'inchiostro: da che parte guarda la superficie, che segno porta, quanto e vicina
  gSegni = vec4(normalize(normal).xy * 0.5 + 0.5, vSegno, gl_FragCoord.w);
}`;
function vesti(mat, edificio) {
  if (S.fumetto) {
    mat.onBeforeCompile = sh => {
      Object.assign(sh.uniforms, FUMO);
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', '#include <common>\nattribute float segno; varying float vSegno;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvSegno = segno;');
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', '#include <common>\nuniform float uSole; uniform vec3 uOmbra; uniform float uRetino; varying float vSegno;\nlayout(location = 1) out highp vec4 gSegni;')
        .replace('#include <opaque_fragment>', FUMO_CORPO + '\n#include <opaque_fragment>');
    };
    mat.customProgramCacheKey = () => 'fumetto';
    return mat;
  }
  if (!S.muro) return mat;
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, CARTA);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\n' + (edificio ? 'attribute float piede;\n' : '') + 'varying vec3 vMondo; varying float vPiede; varying float vMuro;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvMondo = (modelMatrix * vec4(transformed, 1.0)).xyz;\n'
        + (edificio ? 'vPiede = abs(piede); vMuro = (1.0 - step(0.3, abs(objectNormal.y))) * step(0.0, piede);' : 'vPiede = 100.0; vMuro = 0.0;'));
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + CARTA_GLSL)
      .replace('#include <color_fragment>', '#include <color_fragment>\n' + CARTA_CORPO);
  };
  mat.customProgramCacheKey = () => 'carta-' + (edificio ? 'edificio' : 'suolo');
  return mat;
}

function quota(e, n) {
  const fx = Math.min(T.nx - 1.001, Math.max(0, (e - T.e0) / T.passo));
  const fy = Math.min(T.ny - 1.001, Math.max(0, (n - T.n0) / T.passo));
  const i = Math.floor(fx), j = Math.floor(fy), u = fx - i, v = fy - j, q = T.q;
  return q[j * T.nx + i] * (1 - u) * (1 - v) + q[j * T.nx + i + 1] * u * (1 - v)
       + q[(j + 1) * T.nx + i] * (1 - u) * v + q[(j + 1) * T.nx + i + 1] * u * v;
}

function centro(r) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < r.length; i++) {
    const p = r[i], q = r[(i + 1) % r.length], k = p[0] * q[1] - q[0] * p[1];
    a += k; cx += (p[0] + q[0]) * k; cy += (p[1] + q[1]) * k;
  }
  if (Math.abs(a) < 1e-6) return [r[0][0], r[0][1]];
  return [cx / (3 * a), cy / (3 * a)];
}

function seme(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 1000) / 1000;
}

// ---------------------------------------------------------------- scena
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: !S.fumetto });
} catch (err) {

  box.hidden = false;
  box.textContent = 'Questo browser non riesce ad aprire la grafica 3D (WebGL).';
  throw err;
}
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const CIELO = new THREE.Color();
if (!S.fumetto) scene.background = CIELO;
scene.fog = new THREE.Fog(CIELO, 1400, 4500);
let sporco = true;                       // c'e qualcosa da ridisegnare
// il cielo segue il tema chiaro o scuro di chi guarda. Il fumetto resta sempre su carta.
function tema() {
  const radice = document.documentElement, scelta = radice.getAttribute('data-theme');
  const scuro = scelta === 'dark' || (scelta !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  const v = ((S.fumetto || !scuro) && S.fondo) || getComputedStyle(radice).getPropertyValue('--cielo').trim() || '#cfdfe8';
  document.body.style.background = v;

}
tema();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', tema);
new MutationObserver(tema).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
const camera = new THREE.PerspectiveCamera(42, 1, 2, 6000);

scene.add(new THREE.HemisphereLight(S.luce[0], S.luce[1], S.luce[2]));
const sole = new THREE.DirectionalLight(S.luce[3], S.luce[4]);
const versoIlSole = S.sole || [-0.577, 0.698, 0.416];
sole.position.set(versoIlSole[0] * 747, versoIlSole[1] * 747, versoIlSole[2] * 747);
sole.castShadow = true;
sole.shadow.mapSize.set(4096, 4096);
Object.assign(sole.shadow.camera, { left: -LARGO * 1.35, right: LARGO * 1.35, top: LARGO * 1.35, bottom: -LARGO * 1.35, near: 10, far: 2200 });
sole.shadow.camera.updateProjectionMatrix();
sole.shadow.bias = -0.0004;
sole.shadow.normalBias = 0.6;
scene.add(sole, sole.target);
FUMO.uSole.value = S.luce[4] * (sole.color.r + sole.color.g + sole.color.b) / 3 / Math.PI;

// ---------------------------------------------------------------- suolo
{
  const lar = RIQ[1] - RIQ[0], pro = RIQ[3] - RIQ[2], cx = (RIQ[0] + RIQ[1]) / 2, cz = -(RIQ[2] + RIQ[3]) / 2;
  let g;
  if (SOLO) {
    g = new THREE.PlaneGeometry(lar, pro).rotateX(-Math.PI / 2).translate(cx, 0, cz);
  } else {
    const pos = [], idx = [];
    for (let j = 0; j < T.ny; j++) for (let i = 0; i < T.nx; i++) pos.push(T.e0 + i * T.passo, T.q[j * T.nx + i], -(T.n0 + j * T.passo));
    for (let j = 0; j < T.ny - 1; j++) for (let i = 0; i < T.nx - 1; i++) {
      const a = j * T.nx + i, b = a + 1, c = a + T.nx, d = c + 1;
      idx.push(a, b, d, a, d, c);
    }
    g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
  }
  const suolo = new THREE.Mesh(g, vesti(new THREE.MeshLambertMaterial({ color: S.suolo }), false));
  suolo.receiveShadow = true;
  scene.add(suolo);
  const zoccolo = new THREE.Mesh(new THREE.BoxGeometry(lar, 10, pro), vesti(new THREE.MeshLambertMaterial({ color: S.zoccolo }), false));
  zoccolo.position.set(cx, -5.03, cz);
  scene.add(zoccolo);
}

// --------------------------------------------- strade, piazze, verde
function piani() {
  const P = [], C = [], G = [];
  const colore = new THREE.Color();
  let segno = 0;
  const tri = (a, b, c) => {
    const ux = b[0] - a[0], uz = b[2] - a[2], vx = c[0] - a[0], vz = c[2] - a[2];
    if (uz * vx - ux * vz < 0) { const t = b; b = c; c = t; }
    P.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
    for (let k = 0; k < 3; k++) { C.push(colore.r, colore.g, colore.b); G.push(segno); }
  };
  const poligono = (r, tinta, dy) => {
    colore.set(tinta);
    const v = r.map(p => new THREE.Vector2(p[0], p[1]));
    for (const t of THREE.ShapeUtils.triangulateShape(v, []))
      tri(...t.map(i => W(v[i].x, quota(v[i].x, v[i].y) + dy, v[i].y)));
  };
  const nastro = (pts, w, tinta, dy) => {
    colore.set(tinta);
    const q = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1], n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 12));
      for (let k = 0; k < n; k++) q.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
    }
    q.push(pts[pts.length - 1]);
    const L = [], R = [];
    for (let i = 0; i < q.length; i++) {
      const a = q[Math.max(0, i - 1)], b = q[Math.min(q.length - 1, i + 1)];
      let dx = b[0] - a[0], dn = b[1] - a[1];
      const l = Math.hypot(dx, dn) || 1;
      dx /= l; dn /= l;
      const y = quota(q[i][0], q[i][1]) + dy;
      L.push(W(q[i][0] - dn * w / 2, y, q[i][1] + dx * w / 2));
      R.push(W(q[i][0] + dn * w / 2, y, q[i][1] - dx * w / 2));
    }
    for (let i = 0; i < q.length - 1; i++) { tri(L[i], R[i], R[i + 1]); tri(L[i], R[i + 1], L[i + 1]); }
  };
  if (S.fumetto) {
    // nel fumetto il lastricato e una tinta sola da muro a muro, senza bordi di strade. Resta il verde.
    segno = 233 / 255;
    for (const r of D.verde) poligono(r, S.verde, 0.07);
  } else {
    for (const r of D.piazze) poligono(r, S.piazza, 0.04);
    for (const r of D.verde) poligono(r, S.verde, 0.06);
    const COL = { pedestrian: S.piazza, footway: S.passo, steps: S.passo, path: S.passo };
    for (const s of D.strade) if (s.w >= 4) nastro(s.p, s.w, COL[s.k] || S.strada, 0.08);
    for (const s of D.strade) if (s.w < 4) nastro(s.p, s.w, COL[s.k] || S.passo, 0.11);
  }
  if (!P.length) return;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(C, 3));
  g.setAttribute('segno', new THREE.Float32BufferAttribute(G, 1));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, vesti(new THREE.MeshLambertMaterial({ vertexColors: true, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }), false));
  m.receiveShadow = true;
  scene.add(m);
}
piani();

// -------------------------------------------------------------- edifici
const P = [], C = [], C2 = [], PIEDE = [], SEGNI = [], PADRONE = [], LINEE = [];
const FONTE = { m: '#2f7fb8', a: '#2f9e63', p: '#e2a31d', s: '#c8553d' };
const ora = { muro: new THREE.Color(), tetto: new THREE.Color(), muro2: new THREE.Color(), tetto2: new THREE.Color(), terra: 0, segno: 0 };
// I segni dicono all'inchiostro dove passare: ogni edificio ha il suo, e vetri, persiane,
// porte, tende e gronde ne hanno uno a parte. Dove due segni si toccano nasce una riga.
const SEGNO = { vetro: 246 / 255, persiana: 247 / 255, porta: 248 / 255, tenda: 249 / 255, gronda: 250 / 255, costolone: 251 / 255 };
const segnoDi = idx => (1 + (idx * 37) % 199) / 255;

// la scheda di una facciata che nessuno ha guardato: valori tipici del centro di Firenze
function schedaInventata(ed, H) {
  if (ed.cm === '#ece7da') return { materiale: 'marmo', inventata: 1 };
  if (['church', 'cathedral', 'chapel', 'baptistery', 'monastery'].includes(ed.k))
    return { materiale: 'pietra', colore: TINTE.pietra, piani: 1, finestre_ogni_m: 7, persiane: 'nessuna', cornici: 'nessuna',
      zoccolo: 'nessuno', piano_terra: 'portone', gronda: 'semplice', inventata: 1 };
  const k = seme(ed.id), k2 = seme(ed.id + 'x'), k3 = seme(ed.id + 'y');
  return { materiale: 'intonaco', colore: TINTE.intonaci[Math.floor(k * TINTE.intonaci.length)],
    piani: Math.max(2, Math.min(6, Math.round(H / 4.3))), finestre_ogni_m: 3.1 + k2 * 0.8,
    persiane: k2 < 0.45 ? 'verdi' : k2 < 0.7 ? 'marroni' : 'nessuna', cornici: 'pietra',
    piano_terra: k3 < 0.5 ? 'vetrina' : k3 < 0.75 ? 'arco' : 'portone', zoccolo: k3 > 0.6 ? 'pietra' : 'nessuno',
    gronda: 'legno', inventata: 1 };
}

// il colore di muri e tetto secondo lo stile. I pezzi dello stesso monumento hanno lo stesso tono.
const assaggio = new THREE.Color(), hsl = {};
function tinta(ed) {
  if (S.fumetto) {
    const sc = ed._sc;
    ora.muro.set(sc.materiale === 'marmo' ? TINTE.marmo : sc.colore || TINTE.pietra);
    assaggio.set(ed.ct).getHSL(hsl);
    ora.tetto.set(hsl.l > 0.7 ? TINTE.marmo : TINTE.tegole[Math.floor(seme(ed.n || ed.id) * TINTE.tegole.length)]);
    return;
  }
  if (!S.muro) { ora.muro.set(ed.cm); ora.tetto.set(ed.ct); return; }
  ora.muro.set(ed.cm === '#ece7da' ? S.marmo : ed.cm === '#cdbf9f' ? S.pietra : S.muro);
  assaggio.set(ed.ct).getHSL(hsl);
  ora.tetto.set(hsl.l > 0.7 ? S.chiaro : S.tetto);
  const k = 1 + S.varia * (seme(ed.n || ed.id) - 0.5);
  ora.muro.multiplyScalar(k);
  ora.tetto.multiplyScalar(k);
}

function colora(tetto, tinta) {
  const c = tinta || (tetto ? ora.tetto : ora.muro), c2 = tetto ? ora.tetto2 : ora.muro2;
  for (let k = 0; k < 3; k++) { C.push(c.r, c.g, c.b); C2.push(c2.r, c2.g, c2.b); SEGNI.push(ora.segno); }
}
function tri(a, b, c, guida, tetto, tinta) {
  const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
  const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  if (nx * nx + ny * ny + nz * nz < 1e-8) return;
  if (nx * guida[0] + ny * guida[1] + nz * guida[2] < 0) { const t = b; b = c; c = t; }
  P.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
  const sg = tetto ? -1 : 1;
  PIEDE.push(sg * (a[1] - ora.terra), sg * (b[1] - ora.terra), sg * (c[1] - ora.terra));
  colora(tetto, tinta);
}
const linea = (a, b) => LINEE.push(a[0], a[1], a[2], b[0], b[1], b[2]);

function corpo(ed, y0, y1) {
  const s = new THREE.Shape(ed.r.map(p => new THREE.Vector2(p[0], p[1])));
  for (const f of ed.f || []) s.holes.push(new THREE.Path(f.map(p => new THREE.Vector2(p[0], p[1]))));
  let g = new THREE.ExtrudeGeometry(s, { depth: y1 - y0, bevelEnabled: false });
  g.rotateX(-Math.PI / 2);
  g.translate(0, y0, 0);
  if (g.index) g = g.toNonIndexed();
  const pos = g.attributes.position.array, nor = g.attributes.normal.array;
  for (let i = 0; i < pos.length; i += 9) {
    for (let k = 0; k < 9; k++) P.push(pos[i + k]);
    PIEDE.push(pos[i + 1] - ora.terra, pos[i + 4] - ora.terra, pos[i + 7] - ora.terra);
    colora(nor[i + 1] > 0.5);
  }
  if (S.spigoli) {
    const bordi = new THREE.EdgesGeometry(g, 30).attributes.position.array;
    for (let i = 0; i < bordi.length; i++) LINEE.push(bordi[i]);
  }
  g.dispose();
}

function tettoPiramide(ed, y0, rh) {
  const c = centro(ed.r), cima = W(c[0], y0 + rh, c[1]), r = ed.r;
  for (let i = 0; i < r.length; i++) {
    const a = W(r[i][0], y0, r[i][1]), b = W(r[(i + 1) % r.length][0], y0, r[(i + 1) % r.length][1]);
    tri(a, b, cima, [a[0] + b[0] - 2 * cima[0], rh + 1, a[2] + b[2] - 2 * cima[2]], true);
    linea(a, cima);
  }
}

function tettoCupola(ed, y0, rh) {
  const c = centro(ed.r), r = ed.r, N = 12, n = r.length;
  // i costoloni si disegnano solo dove la pianta fa spigolo
  const spigolo = r.map((p, i) => {
    const a = r[(i + n - 1) % n], b = r[(i + 1) % n];
    const t = Math.atan2(b[1] - p[1], b[0] - p[0]) - Math.atan2(p[1] - a[1], p[0] - a[0]);
    return Math.abs(Math.atan2(Math.sin(t), Math.cos(t))) > 0.3;
  });
  const raggio = r.reduce((s, p) => s + Math.hypot(p[0] - c[0], p[1] - c[1]), 0) / n;
  const anello = (s, y, fuori) => r.map(p => {
    const d = Math.hypot(p[0] - c[0], p[1] - c[1]) || 1, k = s + fuori / d;
    return [c[0] + (p[0] - c[0]) * k, y, c[1] + (p[1] - c[1]) * k];
  });
  let prec = anello(1, y0, 0).map(p => W(p[0], p[1], p[2]));
  for (let k = 1; k <= N; k++) {
    const th = k / N * Math.PI / 2, s = Math.cos(th), y = y0 + rh * Math.sin(th);

      tri(prec[i], cur[j], cur[i], guida, true);

  }

function tettoFalde(ed, y0, rh) {

    const mezzo = Math.max(...pol.map(p => p[2]));
    if (mezzo < 0.3) continue;
    const V = pol.map(p => W(p[0], y0 + rh * (1 - p[2] / mezzo), p[1]));

    for (const t of THREE.ShapeUtils.triangulateShape(v2, [])) tri(V[t[0]], V[t[1]], V[t[2]], SU, true);

      tri(a0, V[j], V[i], guida, false);

}

// ------------------------------------------------------------- facciate
// Solo nel fumetto. Ogni muro che da sull'aperto prende finestre, persiane, cornici e piano
// terra secondo la scheda dell'edificio. Sono pezze piane appoggiate al muro a pochi centimetri.
const INGOMBRI = D.edifici.map(ed => {
  let e0 = 1e9, e1 = -1e9, n0 = 1e9, n1 = -1e9;
  for (const p of ed.r) { e0 = Math.min(e0, p[0]); e1 = Math.max(e1, p[0]); n0 = Math.min(n0, p[1]); n1 = Math.max(n1, p[1]); }

    const a = r[i], b = r[j];
    if ((a[1] > n) !== (b[1] > n) && e < (b[0] - a[0]) * (n - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
  }

}

  for (let k = 0; k < D.edifici.length; k++) {
    if (k === salvo) continue;
    const q = INGOMBRI[k], ed = D.edifici[k];
    if (e < q[0] || e > q[1] || n < q[2] || n > q[3] || ed.b > 0.5 || ed.h < quotaMin) continue;
    if (dentro(e, n, ed.r)) return true;

// I monumenti sono fatti di piu parti. Per mettere portali e rosone lungo tutta la facciata serve
// sapere dove comincia e dove finisce il fronte: la scheda dice da che parte guarda (fronte: "ovest").
const VERSI = { ovest: [-1, 0], est: [1, 0], nord: [0, 1], sud: [0, -1] };
const FRONTI = {};
for (const ed of D.edifici) {
  const v = ed.sc && VERSI[ed.sc.fronte];
  if (!v || !ed.n || ed.b > 0.5) continue;
  const F = FRONTI[ed.n] || (FRONTI[ed.n] = { v, muri: [] });
  ed.r.forEach((a, i) => {
    const b = ed.r[(i + 1) % ed.r.length], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (L < 4 || ((b[1] - a[1]) * v[0] - (b[0] - a[0]) * v[1]) / L < 0.9) return;
    F.muri.push({ piano: a[0] * v[0] + a[1] * v[1], s0: a[0] * -v[1] + a[1] * v[0], s1: b[0] * -v[1] + b[1] * v[0] });
  });
}
for (const F of Object.values(FRONTI)) {
  F.piano = Math.max(...F.muri.map(m => m.piano));            // il muro piu avanti da quella parte
  const davanti = F.muri.filter(m => F.piano - m.piano < 3);
  F.da = Math.min(...davanti.map(m => Math.min(m.s0, m.s1)));
  F.a = Math.max(...davanti.map(m => Math.max(m.s0, m.s1)));
}

function facciate(ed, idx, y0, muro) {
  const sc = ed._sc, r = ed.r, n = r.length, H = muro - y0, mio = segnoDi(idx);
  const aperti = new Array(n).fill(false);
  if (H < 2.5) return aperti;
  const marmo = sc.materiale === 'marmo';
  const piani = Math.max(1, sc.piani | 0);
  const hpt = piani === 1 ? H : Math.min(5.6, Math.max(3.3, H * (piani >= 4 ? 0.25 : 0.3)));
  const nsu = piani - 1, hf = nsu ? (H - hpt - 0.4) / nsu : 0;
  const pietra = col(sc.cornici === 'chiare' ? '#efe6d2' : TINTE.pietra);
  const pers = sc.persiane && sc.persiane !== 'nessuna' ? col(TINTE.persiane[sc.persiane] || TINTE.persiane.verdi) : null;
  for (let i = 0; i < n; i++) {
    const a = r[i], b = r[(i + 1) % n], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (L < 0.6) continue;
    const u = [(b[0] - a[0]) / L, (b[1] - a[1]) / L], nrm = [u[1], -u[0]];
    // un muro in comune con un vicino alto almeno la meta non ha facciata
    let chiusi = 0;
    for (const t of [0.25, 0.5, 0.75])
      if (occupato(a[0] + u[0] * L * t + nrm[0] * 0.8, a[1] + u[1] * L * t + nrm[1] * 0.8, idx, ed.b + H * 0.5)) chiusi++;
    if (chiusi >= 2) continue;
    aperti[i] = true;
    if (L < 2.4) continue;
    const guida = [nrm[0], 0, -nrm[1]];
    const pt = (s, y, f) => W(a[0] + u[0] * s + nrm[0] * f, y, a[1] + u[1] * s + nrm[1] * f);
    const pezza = (s0, s1, ya, yb, f, tinta, segno) => {
      ora.segno = segno;
      const p0 = pt(s0, ya, f), p1 = pt(s1, ya, f), p2 = pt(s1, yb, f), p3 = pt(s0, yb, f);
      tri(p0, p1, p2, guida, false, tinta);
      tri(p0, p2, p3, guida, false, tinta);

      const rr = w / 2, yi = yb + Math.max(0.3, h - rr);

      let prec = pt(c - rr, yi, f);

      }

      const nb = Math.max(1, Math.round(L / 3.0)), bw = L / nb;
      const verde = col(TINTE.verdeMarmo), bianco = col(TINTE.marmo), rosa = col(TINTE.rosaMarmo), buio = col(TINTE.buio);

        }
      }
      if (extra.includes('bifore')) {
        // il campanile: due ordini di bifore e in cima una trifora per lato

      const diFronte = F && nrm[0] * F.v[0] + nrm[1] * F.v[1] > 0.9 && Math.abs(a[0] * F.v[0] + a[1] * F.v[1] - F.piano) < 3;

        });
        [[0.5, 0.64, 3.3], [0.2, 0.5, 1.9], [0.8, 0.5, 1.9]].forEach(([fraz, alt, rr]) => {

    let nb = Math.max(1, Math.round(L / (sc.finestre_ogni_m || 3.3))), bw = L / nb;
    if (bw < 1.8) { nb = Math.max(1, Math.floor(L / 1.9)); bw = L / nb; }
    if (sc.zoccolo === 'pietra' && nsu) pezza(0, L, y0, y0 + hpt, 0.02, col(TINTE.pietraPt), mio);
    if (sc.cornici !== 'nessuna' && nsu) pezza(0, L, y0 + hpt - 0.14, y0 + hpt + 0.16, 0.05, pietra, mio);

    // piano terra
    const terra = sc.piano_terra || 'muro', centrale = Math.floor(nb / 2);

        if (terra === 'vetrina')
          pezza(c - w / 2 - 0.12, c + w / 2 + 0.12, y0 + h, y0 + h + 0.6, 0.12,
            col(TINTE.tende[Math.floor(seme(ed.id + j) * TINTE.tende.length)]), SEGNO.tenda);
      } else if (terra === 'arco') {
        const w = Math.min(bw * 0.7, 3.2), h = Math.min(hpt * 0.86, 4.6);
        arco(c, w + 0.5, h + 0.25, 0.04, pietra, mio);
        arco(c, w, h, 0.07, col(TINTE.buio), SEGNO.porta);

      for (let j = 0; j < nb; j++) {

        pezza(c - ww / 2, c + ww / 2, ys, ys + wh, 0.07, col(TINTE.vetro), SEGNO.vetro);

    }
  }

  return aperti;

// la gronda: il tetto sporge dai muri che danno sull'aperto, col legno o il cornicione sotto

    ora.segno = SEGNO.gronda;
    tri(a2, b2, B2, [0, -1, 0], false, sotto); tri(a2, B2, A2, [0, -1, 0], false, sotto);   // sotto
    tri(A2, B2, B, guida, false, sotto); tri(A2, B, A, guida, false, sotto);                // di fronte
  }

D.edifici.forEach((ed, idx) => {
  const terra = Math.min(...ed.r.map(p => quota(p[0], p[1])));
  const y0 = terra + ed.b, cima = terra + ed.h;
  ed._cima = cima;
  const muro = Math.max(y0 + 0.3, cima - (ed.rs === 'piatto' ? 0 : ed.rh));
  ora.terra = terra;
  ora.segno = segnoDi(idx);
  ed._sc = ed.sc || schedaInventata(ed, muro - y0);
  tinta(ed);
  ora.muro2.set(FONTE[ed.src]); ora.tetto2.set(FONTE[ed.src]).multiplyScalar(0.72);
  ed._da = P.length / 9;
  corpo(ed, y0, muro);
  if (ed.rs === 'cupola') tettoCupola(ed, muro, cima - muro);
  else if (ed.rs === 'piramide') tettoPiramide(ed, muro, cima - muro);
  else if (ed.rs === 'falde') tettoFalde(ed, muro, cima - muro);
  if (S.fumetto) {
    const aperti = facciate(ed, idx, y0, muro);
    if (ed._sc.materiale !== 'marmo' && ed.b < 0.5 && muro - y0 > 4) gronda(ed, idx, muro, aperti, ed._sc.gronda || 'legno');

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
geo.setAttribute('piede', new THREE.Float32BufferAttribute(PIEDE, 1));
geo.setAttribute('segno', new THREE.Float32BufferAttribute(SEGNI, 1));
const veri = new Float32Array(C), perFonte = new Float32Array(C2);
let base = veri;
const colori = new THREE.BufferAttribute(new Float32Array(veri), 3);
geo.setAttribute('color', colori);
geo.computeVertexNormals();
const case3d = new THREE.Mesh(geo, vesti(new THREE.MeshLambertMaterial({ vertexColors: true }), true));
case3d.castShadow = case3d.receiveShadow = true;
scene.add(case3d);

if (S.spigoli) {
  const gl = new THREE.BufferGeometry();
  gl.setAttribute('position', new THREE.Float32BufferAttribute(LINEE, 3));
  scene.add(new THREE.LineSegments(gl, new THREE.LineBasicMaterial({ color: S.spigoli[0], transparent: true, opacity: S.spigoli[1] })));
}

// --------------------------------------------------------------- alberi
if (D.alberi.length) {
  const chioma = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.6, 0), vesti(new THREE.MeshLambertMaterial({ color: S.chioma, flatShading: true }), false), D.alberi.length);
  const tronco = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.35, 3, 5), vesti(new THREE.MeshLambertMaterial({ color: S.tronco }), false), D.alberi.length);
  const m = new THREE.Matrix4();
  D.alberi.forEach((p, i) => {
    const y = quota(p[0], p[1]), k = 0.8 + ((i * 37) % 10) / 20;
    m.makeScale(k, k * 1.25, k).setPosition(p[0], y + 3 + 2.4 * k, -p[1]);
    chioma.setMatrixAt(i, m);
    m.makeScale(1, 1, 1).setPosition(p[0], y + 1.5, -p[1]);

  });

// ------------------------------------------------------------ inchiostro
// Il fumetto si disegna in due tempi. Prima la scena, una volta sola, che scrive due fogli insieme:
// le tinte piatte col retino, e per ogni pixel da che parte guarda la superficie, che segno porta e
// quanto e vicina. Poi un foglio finale mette l'inchiostro dove cambiano segno, direzione o distanza,
// e dipinge il cielo.
let china = null;
if (S.fumetto) {
  const rt = new THREE.WebGLMultipleRenderTargets(4, 4, 2, { type: THREE.HalfFloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
  const uni = {
    tColore: { value: rt.texture[0] }, tSegni: { value: rt.texture[1] },
    uPasso: { value: new THREE.Vector2(1, 1) }, uScala: { value: 1 },
    uInk: { value: new THREE.Color(S.inchiostro) }, uCarta: { value: new THREE.Color(S.fondo) }, uCielo: { value: new THREE.Color(S.cielo) },
    uRetino: { value: 5 }, uProva: { value: chiesto.get('china') === 'mostra' ? 1 : 0 },
  };
  const foglio = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
    uniforms: uni, depthTest: false, depthWrite: false,
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: `
      uniform sampler2D tColore; uniform sampler2D tSegni;
      uniform vec2 uPasso; uniform float uScala;
      uniform vec3 uInk; uniform vec3 uCarta; uniform vec3 uCielo; uniform float uRetino; uniform float uProva;
      varying vec2 vUv;
      vec3 verso(vec2 c) { vec2 p = c * 2.0 - 1.0; return vec3(p, sqrt(max(0.0, 1.0 - dot(p, p)))); }
      void main() {
        // in a c'e l'inverso della distanza: su una superficie piana cresce in linea retta lungo lo schermo
        vec4 s0 = texture2D(tSegni, vUv);
        float w0 = s0.a, dist = 1.0 / max(w0, 0.0002);
        vec3 n0 = verso(s0.xy);
        float spigolo = 0.0, dettaglio = 0.0, sagoma = 0.0;
        for (int i = 0; i < 2; i++) {
          vec2 d = i == 0 ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec2 o1 = d * uPasso * max(1.0, uScala * 0.8), o2 = d * uPasso * max(1.0, uScala * 1.3);
          vec4 a = texture2D(tSegni, vUv + o1), b = texture2D(tSegni, vUv - o1);
          spigolo = max(spigolo, step(0.3, max(1.0 - dot(n0, verso(a.xy)), 1.0 - dot(n0, verso(b.xy)))));
          float cambia = step(0.002, max(abs(a.z - s0.z), abs(b.z - s0.z)));
          float fine = step(0.955, max(s0.z, max(a.z, b.z)));          // c'entra una finestra, una porta, una persona
          spigolo = max(spigolo, cambia * (1.0 - fine));
          dettaglio = max(dettaglio, cambia * fine);
          // il salto di distanza si misura lungo la normale: cosi le pezze appoggiate ai muri,
          // che viste di taglio sembrano lontane metri, non fanno contorno
          float wa = texture2D(tSegni, vUv + o2).a, wb = texture2D(tSegni, vUv - o2).a;
          sagoma = max(sagoma, step(0.02, abs(wa + wb - 2.0 * w0) / max(w0, 0.00001) * n0.z));
        }
        // un muro visto quasi di taglio schiaccia finestre e riquadri uno sull'altro: li niente dettagli
        dettaglio *= smoothstep(0.06, 0.26, n0.z);
        // da lontano i dettagli si alleggeriscono, i contorni dei volumi restano
        float china = max(sagoma, max(spigolo * 0.9, dettaglio * mix(0.85, 0.25, smoothstep(140.0, 420.0, dist))));
        china *= mix(1.0, 0.6, smoothstep(350.0, 1100.0, dist));
        vec3 colore = texture2D(tColore, vUv).rgb;
        vec2 q = mat2(0.866, 0.5, -0.5, 0.866) * gl_FragCoord.xy / (uRetino * 1.7);
        float r = length(fract(q) - 0.5);
        if (w0 <= 0.0) {
          // cielo: carta in basso, azzurro in alto, e in mezzo un retino che si infittisce
          float k = 0.78 * sqrt(smoothstep(0.12, 0.92, vUv.y));
          colore = mix(uCarta, uCielo, 1.0 - smoothstep(k - 0.07, k + 0.07, r));
        }
        colore = mix(colore, uInk, china);
        // un velo di retino fine su tutta la vignetta, come la stampa
        vec2 q2 = gl_FragCoord.xy / (uRetino * 0.62);
        colore *= 1.0 - 0.05 * (1.0 - smoothstep(0.2, 0.34, length(fract(q2) - 0.5)));
        if (uProva > 0.5) colore = mix(vec3(1.0), vec3(spigolo, dettaglio, sagoma), max(spigolo, max(dettaglio, sagoma)));
        gl_FragColor = vec4(colore, 1.0);
        #include <colorspace_fragment>
      }`,
  }));
  foglio.frustumCulled = false;
  const scenaFoglio = new THREE.Scene();
  scenaFoglio.add(foglio);
  const camFoglio = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  china = { rt, uni, scenaFoglio, camFoglio };
  renderer.setClearColor(0x000000, 0);
}

function disegna() {
  if (!china) { renderer.render(scene, camera); return; }
  renderer.setRenderTarget(china.rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(china.scenaFoglio, china.camFoglio);
}

// ------------------------------------------------------------- comandi
const controlli = new OrbitControls(camera, canvas);
controlli.enableDamping = true;
controlli.dampingFactor = 0.08;
controlli.maxPolarAngle = Math.PI / 2 - 0.04;
controlli.minDistance = 25;
controlli.maxDistance = 2400;
controlli.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
controlli.autoRotateSpeed = 0.5;
controlli.addEventListener('start', () => { controlli.autoRotate = false; });
controlli.addEventListener('change', () => { sporco = true; });
const faro = D.edifici.filter(e => e.rs === 'cupola').sort((a, b) => b.h - a.h)[0];
const mira = faro ? centro(faro.r) : [0, 0];

camera.position.set(mira[0] - 300 * passo, 250 * passo, -mira[1] + 370 * passo);
// la tessera puo portare la sua inquadratura di partenza: dove sta l'occhio e cosa guarda

const VISTA = chiesto.get('vista') ? chiesto.get('vista').split(',').map(Number) : D.vista;
if (VISTA && VISTA.length === 6 && VISTA.every(Number.isFinite)) {

// su uno schermo in piedi si parte da più lontano, così il Duomo entra tutto
if (window.innerWidth < window.innerHeight) camera.position.sub(controlli.target).multiplyScalar(1.6).add(controlli.target);

if (SOLO) {
  // nelle prove ogni riquadro mostra lo stesso pezzo, e girandone uno girano tutti
  const cx = (RIQ[0] + RIQ[1]) / 2, cz = -(RIQ[2] + RIQ[3]) / 2;
  controlli.autoRotate = false;
  controlli.target.set(cx, 30, cz);
  camera.position.set(cx - 105, 95, cz + 165);
  if ('BroadcastChannel' in window) {
    const canale = new BroadcastChannel('citta-3d-vista');
    let daFuori = false;
    controlli.addEventListener('change', () => {
      if (!daFuori) canale.postMessage({ p: camera.position.toArray(), t: controlli.target.toArray() });
    });
    canale.onmessage = ev => {
      daFuori = true;
      camera.position.fromArray(ev.data.p);
      controlli.target.fromArray(ev.data.t);
      controlli.update();
      daFuori = false;
    };
  }
}

let qualita = 1;                         // nel gioco scende da sola se i fotogrammi rallentano
function misura() {
  const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight), dpr = window.devicePixelRatio || 1;
  let rapporto = Math.min(dpr, 2);
  if (china) {
    // il fumetto si disegna un po' piu grande dello schermo e poi si rimpicciolisce: cosi l'inchiostro
    // non fa scalini. Fermo si puo abbondare, nel gioco conta di piu la fluidita.
    rapporto = GIOCO ? Math.min(1.5, dpr * 1.25) * qualita : Math.min(2, Math.max(1.5, dpr));
    if (w * h * rapporto * rapporto > 4.6e6) rapporto = Math.sqrt(4.6e6 / (w * h));
  }
  renderer.setPixelRatio(rapporto);
  renderer.setSize(w, h, false);
  if (GIOCO) {
    camera.aspect = w / (h * 1.3);
    camera.setViewOffset(w, h * 1.3, 0, h * 0.27, w, h);
  } else {
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  if (china) {
    const W2 = Math.round(w * rapporto), H2 = Math.round(h * rapporto);
    china.rt.setSize(W2, H2);
    china.uni.uPasso.value.set(1 / W2, 1 / H2);
    china.uni.uScala.value = rapporto;
    china.uni.uRetino.value = Math.max(3, S.retino * rapporto);
    FUMO.uRetino.value = Math.max(3, S.retino * rapporto);
  }
  sporco = true;
}
window.addEventListener('resize', misura);
misura();

// ---------------------------------------------------- lettura al passaggio
const raggio = new THREE.Raycaster(), punta = new THREE.Vector2(), etichetta = document.getElementById('etichetta');
const DETTO = { m: 'misurata sul DSM', a: 'dichiarata su OpenStreetMap', p: 'ricavata dai piani', s: 'stimata dai vicini' };
let scelto = -1, daGuardare = null;
function evidenzia(idx) {
  if (idx === scelto) return;
  const arr = colori.array;
  if (scelto >= 0) { const e = D.edifici[scelto]; arr.set(base.subarray(e._da * 9, e._a * 9), e._da * 9); }
  if (idx >= 0) { const e = D.edifici[idx]; for (let i = e._da * 9; i < e._a * 9; i++) arr[i] = base[i] + (1 - base[i]) * 0.4; }
  colori.needsUpdate = true;
  scelto = idx;
  sporco = true;
}
canvas.addEventListener('pointermove', ev => { daGuardare = ev; });
canvas.addEventListener('pointerdown', ev => { daGuardare = ev; });
canvas.addEventListener('pointerleave', () => { daGuardare = null; evidenzia(-1); etichetta.hidden = true; });
function guarda() {
  const ev = daGuardare, q = canvas.getBoundingClientRect();
  daGuardare = null;
  punta.set((ev.clientX - q.left) / q.width * 2 - 1, -((ev.clientY - q.top) / q.height) * 2 + 1);
  raggio.setFromCamera(punta, camera);
  const colpo = raggio.intersectObject(case3d, false)[0];
  const idx = colpo ? PADRONE[colpo.faceIndex] : -1;
  evidenzia(idx);
  if (idx < 0) { etichetta.hidden = true; return; }
  const e = D.edifici[idx];
  etichetta.replaceChildren();
  const b = document.createElement('b');
  b.textContent = e.n || (e.p ? 'Parte di edificio' : 'Edificio');
  let testo = `Altezza ${nf(e.h)} m, ${DETTO[e.src]}.` + (e.ti ? ' Forma del tetto inventata.' : '');
  if (S.fumetto) testo += e.sc ? ` Facciata guardata nelle foto, certezza ${e.sc.certezza || 'media'}.` : ' Facciata inventata.';
  etichetta.append(b, testo);
  etichetta.hidden = false;
  etichetta.style.left = Math.min(window.innerWidth - 270, ev.clientX + 14) + 'px';
  etichetta.style.top = Math.min(window.innerHeight - 70, ev.clientY + 14) + 'px';
}

// ================================================================== gioco
// Gavettoni in piazza. Chi gioca e una scimmietta che corre fra i passanti e tira palloncini
// d'acqua. Tutti i personaggi di un tipo sono un solo disegno ripetuto, e braccia e gambe si
// muovono dentro la scheda grafica: quaranta passanti costano cinque chiamate di disegno.
// Si gioca anche in piu: uno dei computer collegati, scelto da solo, muove i passanti e lo dice
// agli altri (nel codice si chiama capo). Chi gioca non se ne accorge, e da soli il capo si e sempre.
function avviaGioco() {
  const GRAV = -19, DURATA = 90, PAUSA = 10, PROTO = D.storia === 'team' ? 13 : 3, IO = 'io';
  const SG = { pelle: 252 / 255, sopra: 253 / 255, sotto: 254 / 255, capo: 1, cosa: 245 / 255, acqua: 244 / 255 };
  const TOCCO = matchMedia('(pointer: coarse)').matches;
  controlli.enabled = false;
  controlli.autoRotate = false;
  camera.fov = 66; camera.near = 0.4; camera.far = 1500;
  misura();
  pannello.hidden = true;
  canvas.tabIndex = 0;
  canvas.style.outline = 'none';
  document.body.classList.add('gioco');

  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), SC = new THREE.Vector3(), ASSE = new THREE.Vector3(0, 1, 0);
  const NIENTE = new THREE.Matrix4().makeScale(0, 0, 0);
  const metti = (mesh, i, x, y, z, giro, sx, sy = sx, sz = sx) =>
    mesh.setMatrixAt(i, M.compose(V.set(x, y, z), Q.setFromAxisAngle(ASSE, giro), SC.set(sx, sy, sz)));
  const casuale = (a, b) => a + Math.random() * (b - a);
  const scarto = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
  const r2 = x => Math.round(x * 100) / 100;
  const ultimi = (lista, voce) => { lista.push(voce); if (lista.length > 4) lista.shift(); };
  let orologio = 0;
  // Sul web (costruisci.py --rete web) ognuno si sceglie un soprannome, e chi vuole una piazza solo
  // per i suoi amici la apre dal cartello d'inizio: il suo nome finisce nell'indirizzo (?piazza=...).
  const WEB = D.rete === 'web';
  const pulisci = s => String(s || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 14);
  const PIAZZA = (chiesto.get('piazza') || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 24) || 'tutti';
  let mioNome = '', statoRete = WEB ? 'cerco' : '';
  try { if (WEB) mioNome = pulisci(localStorage.getItem('gavettoni-nome')); } catch (err) { /* senza memoria lo si riscrive ogni volta */ }

  // ---------------------------------------------- dove si puo stare
  // gli edifici in un indice a celle di 16 metri, per sapere in fretta se un punto e dentro un muro
  const CELLA = 16, celle = new Map();
  D.edifici.forEach((ed, k) => {
    if (ed.b > 0.5) return;
    const q = INGOMBRI[k];
    for (let i = Math.floor(q[0] / CELLA); i <= Math.floor(q[1] / CELLA); i++)
      for (let j = Math.floor(q[2] / CELLA); j <= Math.floor(q[3] / CELLA); j++) {
        const c = i + ',' + j;
        if (!celle.has(c)) celle.set(c, []);
        celle.get(c).push(k);
      }
  });
  const edificioIn = (e, n) => {
    const l = celle.get(Math.floor(e / CELLA) + ',' + Math.floor(n / CELLA));
    if (l) for (const k of l) {
      const q = INGOMBRI[k];
      if (e >= q[0] && e <= q[1] && n >= q[2] && n <= q[3] && dentro(e, n, D.edifici[k].r)) return k;
    }
    return -1;
  };
  const libero = (e, n) => Math.abs(e) < META - 1.5 && Math.abs(n) < META - 1.5 && edificioIn(e, n) < 0;

  // ------------------------------------------------------ pupazzi
  // Un pupazzo e fatto di palle, tubi e casse. Ogni pezzo dice a che parte del corpo appartiene
  // (0 fermo, 1 e 2 gambe, 3 e 4 braccia, 6 il palloncino in mano) e che segno porta per l'inchiostro.
  function pupazzo() {
    const pos = [], nor = [], tin = [], par = [], seg = [];
    let ox = 0, oy = 0, oz = 0, fermi = false;
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), eu = new THREE.Euler(), v = new THREE.Vector3(), sc = new THREE.Vector3(), c = new THREE.Color();
    const agg = (g, x, y, z, sx, sy, sz, rx, rz, tinta, parte, segno) => {
      if (g.index) { const h = g.toNonIndexed(); g.dispose(); g = h; }
      if (fermi) parte = 0;
      g.applyMatrix4(m.compose(v.set(x + ox, y + oy, z + oz), q.setFromEuler(eu.set(rx, 0, rz)), sc.set(sx, sy, sz)));
      const p = g.attributes.position.array, n = g.attributes.normal.array;
      c.set(tinta);
      for (let i = 0; i < p.length; i += 3) {
        pos.push(p[i], p[i + 1], p[i + 2]);
        nor.push(n[i], n[i + 1], n[i + 2]);
        tin.push(c.r, c.g, c.b);
        par.push(parte);
        seg.push(segno);
      }
      g.dispose();
    };
    const fa = {
      palla(r, x, y, z, tinta, parte = 0, segno = SG.pelle, sx = 1, sy = 1, sz = 1, fine = 8) {
        agg(new THREE.SphereGeometry(r, fine, Math.max(4, fine - 2)), x, y, z, sx, sy, sz, 0, 0, tinta, parte, segno);
        return fa;
      },
      tubo(r1, r2, h, x, y, z, tinta, parte = 0, segno = SG.sopra, sz = 1, rx = 0, rz = 0) {
        agg(new THREE.CylinderGeometry(r1, r2, h, 7), x, y, z, 1, 1, sz, rx, rz, tinta, parte, segno);
        return fa;
      },
      cassa(w, h, d, x, y, z, tinta, parte = 0, segno = SG.cosa, rx = 0, rz = 0) {
        agg(new THREE.BoxGeometry(w, h, d), x, y, z, 1, 1, 1, rx, rz, tinta, parte, segno);
        return fa;
      },
      // da qui in poi i pezzi nascono spostati di tanto (per mettere una cosa accanto a un'altra)
      sposta(x, y, z) { ox = x; oy = y; oz = z; return fa; },
      // da qui in poi i pezzi stanno fermi, anche se sarebbero braccia o gambe
      ferma(si) { fermi = si; return fa; },
      fatto() {
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
        g.setAttribute('color', new THREE.Float32BufferAttribute(tin, 3));
        g.setAttribute('parte', new THREE.Float32BufferAttribute(par, 1));
        g.setAttribute('segno', new THREE.Float32BufferAttribute(seg, 1));
        return g;
      },
    };
    return fa;
  }

  // una persona alta un metro e ottanta, con la testa un po' grande come nei fumetti
  function persona(p, o) {
    for (const [lato, parte] of [[-1, 1], [1, 2]]) {
      p.tubo(0.088, 0.078, 0.44, lato * 0.1, 0.66, 0, o.sotto, parte, SG.sotto);

  // Il movimento sta nel disegno. Per ogni personaggio la scheda grafica riceve quattro numeri

  const PERSONA_DICH = `
attribute float parte; attribute vec4 aVita; uniform float uAnca; uniform float uSpalla; uniform float uPernoZ; varying float vBagnato;
vec3 gira(vec3 p, float perno, float pz, float a) { float c = cos(a), s = sin(a); p.y -= perno; p.z -= pz; return vec3(p.x, p.y * c - p.z * s + perno, p.y * s + p.z * c + pz); }`;
  const PERSONA_MOTO = `
float falcata = sin(aVita.x) * 0.75 * aVita.y, su = aVita.w * 2.7;
float senza = step(1.5, aVita.z);
float pz = uPernoZ * sign(position.z);          // chi ha quattro zampe le ha davanti e dietro, non sotto
if (parte > 0.5 && parte < 1.5) transformed = gira(transformed, uAnca, pz, falcata);
else if (parte > 1.5 && parte < 2.5) transformed = gira(transformed, uAnca, pz, -falcata);
else if (parte > 2.5 && parte < 3.5) transformed = gira(transformed, uSpalla, 0.0, -falcata * 0.8 - su);
else if (parte > 3.5) transformed = gira(transformed, uSpalla, 0.0, falcata * 0.8 - su);
if (parte > 5.5 && senza > 0.5) transformed = vec3(0.0, -9.0, 0.0);

  function schiera(geo, n, anca, spalla, pernoZ = 0) {

    const base = mat.onBeforeCompile;
    mat.onBeforeCompile = sh => {
      base(sh);
      sh.uniforms.uAnca = { value: anca };

        .replace('#include <common>', '#include <common>\nvarying float vBagnato;')

  // un mucchio di cose uguali e semplici: palloncini, gocce, pozze, ombre

  }

  // ogni tipo ha un posto in piu: e la controfigura che sfila nella presentazione
  for (const t of TIPI) Object.assign(t, schiera(t.geo, t.quanti + 1, t.anca || 0.88, 1.4, t.pernoZ || 0));
  // le scimmiette: la 0 e chi gioca, da 1 a 3 i compari sui tetti, da 4 a 11 gli altri giocatori
  const ALTRI_DA = 4, ALTRI_MAX = 8;
  const scimmie = schiera(scimmia(), ALTRI_DA + ALTRI_MAX, 0.3, 0.64);
  const TINTE_SCIMMIA = ['#c9d6ee', '#ffb3a1', '#c4ecb0', '#e0c2ff', '#fff1a6', '#a9e4e0', '#f4c1dc', '#ffd9a8'];
  for (let i = 0; i < ALTRI_DA + ALTRI_MAX; i++) scimmie.mesh.setColorAt(i, col(i < ALTRI_DA ? '#ffffff' : TINTE_SCIMMIA[i - ALTRI_DA]));

  // ------------------------------------------------------ le vie dei passanti
  // i passanti camminano lungo le strade pedonali e i marciapiedi di OpenStreetMap, e dove due vie si toccano svoltano
  const faVia = p => {
    const cum = [0];
    for (let i = 1; i < p.length; i++) cum.push(cum[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
    return { p, cum, lung: cum[cum.length - 1], agganci: [[], []] };
  };
  const vie = D.strade.map(s => s.p).filter(p => p.length > 1).map(faVia).filter(v => {
    const a = v.p[0], b = v.p[v.p.length - 1], c = v.p[Math.floor(v.p.length / 2)];
    return v.lung > 14 && libero(c[0], c[1]) && Math.abs(a[0]) < META && Math.abs(b[0]) < META;
  });
  if (!vie.length) vie.push(faVia([[-40, -40], [40, -40], [40, 40], [-40, 40], [-40, -40]]));
  vie.forEach((a, i) => vie.forEach((b, j) => {
    if (i === j) return;
    for (const ca of [0, 1]) for (const cb of [0, 1]) {
      const pa = a.p[ca ? a.p.length - 1 : 0], pb = b.p[cb ? b.p.length - 1 : 0];
      if (Math.hypot(pa[0] - pb[0], pa[1] - pb[1]) < 7) a.agganci[ca].push({ via: b, capo: cb });
    }
  }));
  const qui = [0, 0, 0, 1];
  function sulla(via, s) {
    const c = via.cum;
    let i = 1;
    while (i < c.length - 1 && c[i] < s) i++;
    const a = via.p[i - 1], b = via.p[i], l = c[i] - c[i - 1] || 1, t = Math.min(1, Math.max(0, (s - c[i - 1]) / l));
    qui[0] = a[0] + (b[0] - a[0]) * t; qui[1] = a[1] + (b[1] - a[1]) * t;
    qui[2] = (b[0] - a[0]) / l; qui[3] = (b[1] - a[1]) / l;
  }
  // il punto di una via piu vicino a un punto qualunque: serve a chi ha lasciato la strada per tornarci
  function aggancia(e, n) {
    let meglio = null, dmin = 1e9;
    for (const v of vie) for (let i = 1; i < v.p.length; i++) {
      const a = v.p[i - 1], b = v.p[i], dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy || 1;
      const t = Math.min(1, Math.max(0, ((e - a[0]) * dx + (n - a[1]) * dy) / l2)), px = a[0] + dx * t, py = a[1] + dy * t, d = Math.hypot(e - px, n - py);
      if (d < dmin) { dmin = d; meglio = { via: v, s: v.cum[i - 1] + Math.sqrt(l2) * t, e: px, n: py }; }
    }
    return meglio;
  }

  const gente = [];
  for (const t of TIPI) {
    t.bagnati = 0;
    for (let i = 0; i < t.quanti; i++) {
      const k = gente.length, via = vie[Math.floor(Math.random() * vie.length)], s = Math.random() * via.lung;
      sulla(via, s);
      gente.push({ k, tipo: t, i, taglia: t.speciale ? 1 : 0.94 + seme('g' + k) * 0.12, e: qui[0], n: qui[1], yaw: 0, fase: seme('f' + k) * 6, corre: 0.7, ve: 0, vn: 0,
        st: 0, bagnato: 0, braccia: 0, salto: 0, ottimista: 0, riposo: 0, giro: 1, prossima: casuale(2, 6),
        via, s, verso: Math.random() < 0.5 ? 1 : -1, vel: t.vel * casuale(0.85, 1.15), lato: casuale(-1.1, 1.1), timer: 0, preda: null, te: 0, tn: 0,
        ae: qui[0], an: qui[1], be: qui[0], bn: qui[1] });

  // ------------------------------------------------------ chi gioca e i compari
  let partenza = [-108, 0];
  cerca: for (let r = 0; r < 40; r += 2) for (let a = 0; a < 6.3; a += 0.7) {
    const e = -108 + Math.cos(a) * r, n = Math.sin(a) * r;
    if (libero(e, n) && libero(e + 1, n) && libero(e - 1, n)) { partenza = [e, n]; break cerca; }
  }
  for (let prova = 0; prova < 12; prova++) {           // un po' sparsi, cosi due giocatori non nascono uno sull'altro
    const e = partenza[0] + casuale(-5, 5), n = partenza[1] + casuale(-5, 5);
    if (libero(e, n) && libero(e + 0.6, n) && libero(e - 0.6, n)) { partenza = [e, n]; break; }
  }
  const io = { e: partenza[0], n: partenza[1], y: 0, vy: 0, yaw: Math.PI / 2, fase: 0, moto: 0, lancio: 0, ricarica: 0, fradicio: 0, stordito: 0, rapito: 0, rapitore: -1 };
  const occhio = { giro: Math.PI / 2, alza: 0.6 };

  const mira = () => { const u = (1.15 - occhio.alza) / 1.1; return 3.5 + 42 * u * u; };
  // tre compari appollaiati sui tetti piu bassi attorno alla piazza
  const compari = [];
  {
    const scelti = D.edifici.map((ed, k) => ({ ed, k, c: centro(ed.r) }))
      .filter(o => !o.ed.p && o.ed.b < 0.5 && o.ed.h > 9 && o.ed.h < 24 && Math.hypot(o.c[0] + 20, o.c[1]) < 120)
      .sort((a, b) => a.ed.h - b.ed.h);
    for (const o of scelti) {
      if (compari.length >= 3) break;
      let v = o.ed.r[0];
      for (const q of o.ed.r) if (Math.hypot(q[0] + 20, q[1]) < Math.hypot(v[0] + 20, v[1])) v = q;
      const e = v[0] + (o.c[0] - v[0]) * 0.12, n = v[1] + (o.c[1] - v[1]) * 0.12;

  // ------------------------------------------------------ palloncini, gocce, pozze, ombre
  const gPalla = new THREE.SphereGeometry(0.17, 8, 6).scale(1, 1.15, 1);
  const palle = Array.from({ length: 16 }, () => ({ vivo: false, p: new THREE.Vector3(), v: new THREE.Vector3(), mio: false, finto: false, de: 0, dn: 0 }));
  const mPalle = mucchio(gPalla, palle.length, '#2f8fe0', SG.acqua);
  const gocce = Array.from({ length: 110 }, () => ({ t: 0, p: new THREE.Vector3(), v: new THREE.Vector3() }));
  const mGocce = mucchio(new THREE.OctahedronGeometry(0.075), gocce.length, '#55b0f2', 0);
  const pozze = Array.from({ length: 18 }, () => ({ t: 0, x: 0, z: 0, r: 1 }));
  const mPozze = mucchio(new THREE.CircleGeometry(1, 12).rotateX(-Math.PI / 2), pozze.length, '#8fcdf2', SG.acqua);
  const tintaOmbra = col(S.suolo).clone();
  tintaOmbra.r *= S.ombra[0]; tintaOmbra.g *= S.ombra[1]; tintaOmbra.b *= S.ombra[2];
  // le ombre: la 0 e la mia, poi quelle degli altri giocatori, dei passanti e dei palloncini
  const OMBRA_GENTE = 1 + ALTRI_MAX, OMBRA_PALLE = OMBRA_GENTE + gente.length, OMBRA_ATTORI = OMBRA_PALLE + palle.length;
  const mOmbre = mucchio(new THREE.CircleGeometry(0.4, 10).rotateX(-Math.PI / 2), OMBRA_ATTORI + 3, tintaOmbra, 0);
  mOmbre.material.polygonOffset = true;

  mOmbre.material.polygonOffsetUnits = -3;
  mPozze.material.polygonOffset = true;

  mPozze.material.polygonOffsetUnits = -5;
  let nGoccia = 0, nPozza = 0;

  // ------------------------------------------------------ targhe, scritte, nuvolette, cartelli
  const crea = (tag, classe, testo) => { const el = document.createElement(tag); if (classe) el.className = classe; if (testo) el.textContent = testo; return el; };
  const hud = crea('div'); hud.id = 'hud';
  const targa = scrittaPiccola => { const t = crea('div', 'targa'), n = document.createTextNode('0'); t.append(crea('small', '', scrittaPiccola), n); hud.append(t); return n; };
  const nPunti = targa('PUNTI'), nTempo = targa('TEMPO'), nSerie = targa('SERIE');

  const scritte = Array.from({ length: 6 }, () => crea('div', 'botto'));
  const nuvole = Array.from({ length: 4 }, () => ({ el: crea('div', 'nuvola'), g: null, fino: 0 }));

  hud.hidden = mirino.hidden = podio.hidden = tSerie.hidden = true;
  for (const c of cartellini) c.hidden = true;
  let nScritta = 0, nNuvola = 0;
  const VERSI_SPLASH = ['SPLASH!', 'CIAFF!', 'SPLAT!', 'SCIAC!'];
  // dove cade sullo schermo un punto del mondo, oppure niente se e dietro o fuori
  const tela = { x: 0, y: 0 };
  function aSchermo(x, y, z) {
    V.set(x, y, z).project(camera);
    if (V.z > 1 || Math.abs(V.x) > 1.15 || Math.abs(V.y) > 1.15) return false;
    const q = canvas.getBoundingClientRect();
    tela.x = q.left + (V.x * 0.5 + 0.5) * q.width;

  // ------------------------------------------------------ suoni, fatti al momento senza file
  let audio = null, rumore = null;
  function accendiAudio() {
    if (audio) return;
    try {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      rumore = audio.createBuffer(1, audio.sampleRate * 0.4, audio.sampleRate);
      const d = rumore.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (err) { audio = null; }
  }
  function suono(tipo, forza = 1) {
    if (!audio) return;
    try {
      const t = audio.currentTime;
      if (tipo === 'guaio') {             // preso o multato: due note che scendono
        for (const [f, quando] of [[330, 0], [196, 0.14]]) {
          const o = audio.createOscillator(), g = audio.createGain();
          o.type = 'square';
          o.frequency.setValueAtTime(f, t + quando);
          g.gain.setValueAtTime(0.12, t + quando);

          o.connect(g); g.connect(audio.destination);
          o.start(t + quando); o.stop(t + quando + 0.18);
        }

      }
      const src = audio.createBufferSource(), filtro = audio.createBiquadFilter(), vol = audio.createGain();
      src.buffer = rumore;
      src.connect(filtro); filtro.connect(vol); vol.connect(audio.destination);
      if (tipo === 'splash') {

      if (scoppia) {
        b.vivo = false;
        splash(b.p.x, Math.max(0.15, b.p.y), b.p.z, Math.max(0.25, 1 - Math.hypot(e - io.e, n - io.n) / 70));
        if (b.mio) {
          if (colpito && colpito.bagnato <= 0.35) hoBagnato(colpito, b);
          else if (scimmiaColpita) {
            if (!scimmiaColpita.frad && scimmiaColpita.bagnatoDaMe <= 0) {
              punti += 1;
              scimmiaColpita.bagnatoDaMe = 2.2;
              ultimi(mieiColpi, [++nColpo, 's', scimmiaColpita.id, 1]);
              daMandare = true;
              scritta(b.p.x, b.p.y + 1.1, b.p.z, 'SPLASH! +1');
            }
          } else if (!colpito) serie = 0;            // a vuoto: la serie si rompe
        } else if (!b.finto && capo && colpito) bagna(colpito, null);
        mPalle.setMatrixAt(k, NIENTE);
        mOmbre.setMatrixAt(ombra, NIENTE);
        continue;
      }
      metti(mPalle, k, b.p.x, b.p.y, b.p.z, orologio * 9 + k, 1);
      metti(mOmbre, ombra, b.p.x, quota(e, n) + 0.02, b.p.z, 0, 0.45);
    }

    // --- gocce e pozze
    for (let k = 0; k < gocce.length; k++) {
      const g = gocce[k];
      if (g.t <= 0) { mGocce.setMatrixAt(k, NIENTE); continue; }
      g.t -= dt;
      g.v.y += -14 * dt;
      g.p.addScaledVector(g.v, dt);
      metti(mGocce, k, g.p.x, Math.max(0.05, g.p.y), g.p.z, k, Math.max(0.05, Math.min(1, g.t * 3.2)));
    }
    for (let k = 0; k < pozze.length; k++) {
      const z = pozze[k];
      if (z.t <= 0) { mPozze.setMatrixAt(k, NIENTE); continue; }
      z.t -= dt;
      const s = z.r * Math.min(1, (7 - z.t) * 6) * Math.min(1, z.t / 2.5);
      metti(mPozze, k, z.x, quota(z.x, -z.z) + 0.03, z.z, k, Math.max(0.01, s), 1, Math.max(0.01, s));
    }

    inScena(dt);
    for (const t of TIPI) { t.mesh.instanceMatrix.needsUpdate = true; t.vita.needsUpdate = true; }
    scimmie.mesh.instanceMatrix.needsUpdate = true; scimmie.vita.needsUpdate = true;
    mPalle.instanceMatrix.needsUpdate = mGocce.instanceMatrix.needsUpdate = mPozze.instanceMatrix.needsUpdate = mOmbre.instanceMatrix.needsUpdate = true;

    // --- nuvolette che seguono chi parla
    for (const nv of nuvole) {
      if (!nv.g || orologio > nv.fino) { nv.g = null; continue; }
      if (aSchermo(nv.g.e, (nv.g.tipo.alto || 2.15) * nv.g.taglia, -nv.g.n)) { nv.el.style.left = Math.round(tela.x) + 'px'; nv.el.style.top = Math.round(tela.y) + 'px'; }
    }

    // --- targhe, classifica, conto alla rovescia
    if (punti !== mostrati) { mostrati = punti; nPunti.nodeValue = String(punti); }
    const sec = turno.s === 'g' ? Math.ceil(turno.t) : 0;
    if (sec !== mostratoTempo) { mostratoTempo = sec; nTempo.nodeValue = String(sec); }
    const molt = serie >= 6 ? 3 : serie >= 3 ? 2 : 1;
    if (molt !== mostrataSerie) { mostrataSerie = molt; nSerie.nodeValue = 'x' + molt; tSerie.hidden = molt < 2; }
    if (orologio - ultimoPodio > 0.5) {
      ultimoPodio = orologio;
      const lista = sonoDentro ? classifica() : [];
      podio.hidden = lista.length < 2;
      if (lista.length > 1) {
        podio.replaceChildren(...lista.slice(0, 6).map(r => { const d = crea('div'); d.append(document.createTextNode(r.nome), crea('b', '', String(r.pt))); return d; }));
      }
      if (rigaConto && turno.s === 'f') rigaConto.textContent = `Nuova partita fra ${Math.max(0, Math.ceil(turno.t))} secondi.`;
      if (rigaStato && rigaStato.isConnected && !/^http|copiato/.test(rigaStato.textContent)) rigaStato.textContent = statoPiazza();
    }
    spedisci();
  }

  // la prima volta si parte dalla presentazione, poi dal cartello (da li la si puo rivedere).
  // ?passo=3 apre la presentazione a quel passo, per guardarla
  let gia = false;
  try { gia = localStorage.getItem('gavettoni-visto') === '1'; } catch (err) { /* senza memoria la si rivede ogni volta */ }
  if (chiesto.get('passo') === 'fine') cartelloInizio();
  else if (chiesto.get('passo')) mostraPasso(Math.min(PASSI.length, Math.max(1, Number(chiesto.get('passo')) || 1)) - 1);
  else if (gia || chiesto.get('prova')) cartelloInizio();
  else presenta();
  if (chiesto.get('prova')) {
    // per le prove senza mani: si entra da soli, la scimmietta mira al passante piu vicino e tira,
    // un pezzo alla volta, cosi fra un pezzo e l'altro i messaggi di rete hanno il tempo di arrivare
    entra();
    const punta = () => {
      let scelto = null, dist = 1e9;
      for (const g of gente) { const d = Math.hypot(g.e - io.e, g.n - io.n); if (d > 5 && d < dist && g.bagnato < 0.3) { dist = d; scelto = g; } }
      if (scelto) {
        occhio.giro = Math.atan2(scelto.e - io.e, scelto.n - io.n);
        occhio.alza = 1.15 - 1.1 * Math.sqrt(Math.min(1, Math.max(0, (dist - 3.5) / 42)));
      }
      return scelto;
    };
    let giri = 0;
    const pezzo = () => {
      for (let i = 0; i < 12; i++, giri++) {
        if (giri % 30 === 0) punta();
        if (giri % 30 === 2) tira();
        avanza(1 / 60);
      }
      if (giri < 480) { setTimeout(pezzo, 15); return; }
      if (chiesto.get('prova') === 'sfilata' || chiesto.get('prova') === 'manifesto') {
        // I cinque della compagnia in fila davanti all'occhio, fermi, per guardarli bene. "manifesto" e la
        // stessa posa piu stretta, senza targhe, con la scimmietta in fila e il titolo sotto: e la figura
        // che accompagna il link quando gira nelle chat.
        const manifesto = chiesto.get('prova') === 'manifesto', spazio = manifesto ? 2.4 : 3.7, primo = manifesto ? -117.4 : -119;
        avanza(1 / 60);
        congelato = true;
        mirino.hidden = true;
        gente.filter(g => g.tipo.speciale).forEach((g, i) => {
          const e = primo + i * spazio, n = 5;
          metti(g.tipo.mesh, g.i, e, 0, -n, i === 0 ? 0.35 : i === 1 ? 0.9 : 0, 1);
          metti(mOmbre, OMBRA_GENTE + g.k, e, 0.02, -n, 0, 1);
          g.tipo.vita.setXYZW(g.i, 0.9, 0.7, 0, g.tipo.allegra ? 0.5 : 0);
          g.tipo.mesh.instanceMatrix.needsUpdate = true; g.tipo.vita.needsUpdate = true;
        });
        if (manifesto) {
          // in posa ci sono solo loro: via i passanti, i palloncini e le pozze
          for (const g of gente) if (!g.tipo.speciale) { g.tipo.mesh.setMatrixAt(g.i, NIENTE); g.tipo.mesh.instanceMatrix.needsUpdate = true; mOmbre.setMatrixAt(OMBRA_GENTE + g.k, NIENTE); }
          mPalle.count = mGocce.count = mPozze.count = 0;
          metti(mOmbre, 0, primo + 5 * spazio, 0.02, -5, 0, 1);
          metti(scimmie.mesh, 0, primo + 5 * spazio, 0, -5, -0.3, 1.25);
          scimmie.vita.setXYZW(0, 0, 0, 0, 0);
          scimmie.vita.needsUpdate = true;
          for (const el of [hud, lista, podio, document.getElementById('crediti'), ...scritte, ...nuvole.map(q => q.el)]) if (el) el.style.display = 'none';
          const parole = D.titolo.toUpperCase().split(' '), titolo = crea('div');
          titolo.append(crea('div', '', parole[0]), crea('div', '', parole.slice(1).join(' ')));
          titolo.style.cssText = 'position:fixed;z-index:5;left:4%;right:4%;bottom:6%;text-align:center;font:400 10.5vw/.95 "Bangers",sans-serif;'
            + 'letter-spacing:.03em;color:#ffd23f;-webkit-text-stroke:.3vw #231c1a;text-shadow:.6vw .6vw 0 #231c1a';
          document.body.append(titolo);
          camera.position.set(primo + 2.5 * spazio, 1.6, 2.2);
          camera.lookAt(primo + 2.5 * spazio, 1.0, -5);
        } else {
          scimmie.mesh.setMatrixAt(0, NIENTE);
          camera.position.set(-111.2, 1.9, 6.6);
          camera.lookAt(-111.6, 1.0, -5);
        }
        scimmie.mesh.instanceMatrix.needsUpdate = mOmbre.instanceMatrix.needsUpdate = true;
        disegna();
        return;
      }
      if (chiesto.get('prova') === 'faccia') {
        // un ritratto: l'occhio va davanti alla scimmietta, da vicino, e tutto si ferma
        avanza(1 / 60);
        const f = [Math.sin(io.yaw), Math.cos(io.yaw)];
        camera.position.set(io.e + f[0] * 2.1 + f[1] * 0.5, 0.95, -io.n + f[1] * 2.1 - f[0] * 0.5);
        camera.lookAt(io.e, 0.72, -io.n);
        congelato = true;
        mirino.hidden = true;
        disegna();
        return;
      }
      const g = punta();
      avanza(1 / 60);
      if (g && capo) { bagna(g, IO); splash(g.e, 1.3, -g.n, 1); scritta(g.e, 2.6, -g.n, 'SPLASH! +1'); }
      avanza(0.06);
      avanza(0.06);
      disegna();
    };
    pezzo();
  }
  return { avanza, tira, entra, io, occhio, gente, altri, turno, presenta, mostraPasso, finePresentazione, cartelloInizio, statoPiazza, passi: PASSI.length,
    info: () => ({ dentro: sonoDentro, turno: turno.s + turno.k + ' ' + Math.ceil(turno.t), punti, serie, capo, mioId, capoId, altri: [...altri.values()].map(a => [a.id, a.gi ? 1 : 0, a.pt, r2(a.e), r2(a.n)]),
      palle: palle.filter(b => b.vivo).length, storia: D.storia || '', rete: statoRete, sano: sano(), istantanee: nIst, piazza: PIAZZA, nome: mioNome, passo: passoN, pari: stanza ? stanza.pari().length : 0, rapito: io.rapito, media, qualita, vie: vie.length, compari: compari.length, tipi: TIPI.map(t => t.nome + ' ' + t.quanti).join(', ') }) };
}
const gioco = GIOCO ? avviaGioco() : null;

let ultimo = performance.now();
function giro(adesso) {
  requestAnimationFrame(giro);
  adesso = adesso || performance.now();
  const dt = Math.min(0.05, Math.max(0.001, (adesso - ultimo) / 1000));
  ultimo = adesso;
  if (gioco) { gioco.avanza(dt); disegna(); return; }
  controlli.update();
  if (daGuardare) guarda();
  if (sporco) { sporco = false; disegna(); }
}
controlli.update();
disegna();
requestAnimationFrame(giro);
window.__citta = { disegna, D, S, scene, camera, renderer, controlli, case3d, gioco, triangoli: P.length / 9, ridisegna: () => { sporco = true; } };
</script>
<!--/CORPO-->
